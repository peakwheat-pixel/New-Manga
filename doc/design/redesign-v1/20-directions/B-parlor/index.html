<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>夜光列车 · 第12话「雨の停車場」 — 校阅台 Parlor</title>
<meta name="description" content="方向 B · 校阅台。以文本为主体、图像为佐证的双语工作稿校对界面。纯静态原型。">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <symbol id="i-caret-right" viewBox="0 0 20 20"><path d="M8.2 6.4 11.8 10l-3.6 3.6"/></symbol>

  <symbol id="i-layers" viewBox="0 0 20 20"><path d="M10 3 16.6 6.4 10 9.8 3.4 6.4z"/><path d="M3.4 10.1 10 13.5l6.6-3.4"/><path d="M3.4 13.7 10 17.1l6.6-3.4"/></symbol>

<div class="app" id="app">

  <!-- ===== 顶栏 44px ==================================================== -->
  <header class="topbar" role="banner">
    <div class="masthead">
      <span class="masthead__imprint">NEW MANGA · 校阅台</span>
      <h1 class="masthead__title" id="mastTitle">夜光列车 <em>· 第12话「雨の停車場」</em></h1>
      <span class="masthead__rule" aria-hidden="true"></span>
      <span class="masthead__meta" id="mastMeta">23 页 · 日→中 · Paged RTL</span>
    </div>

    <!-- 作用域必须常驻可见 -->
    <div class="scope-chip" id="scopeChip" data-scope="chapter">
      作用域 <b id="scopeVal">本章 23 页</b>
    </div>

    <div class="topbar__spacer"></div>

    <!-- 三呈现：分段控件 -->
    <div class="segmented" id="viewSeg" role="tablist" aria-label="呈现方式">
      <button class="segmented__item" role="tab" data-view="proof" aria-selected="true" title="对照：账本式双语对照（V 循环切换）">对照 <kbd>1</kbd></button>
      <button class="segmented__item" role="tab" data-view="canvas" aria-selected="false" title="画布：页面示意图与行联动（V 循环切换）">画布 <kbd>2</kbd></button>
      <button class="segmented__item" role="tab" data-view="final" aria-selected="false" title="成品：只验收成品页（V 循环切换）">成品 <kbd>3</kbd></button>
    </div>

    <button class="btn" id="btnExport" title="导出抽屉（Ctrl+E）">
      <svg class="icon icon--sm"><use href="#i-export"></use></svg>导出<span class="btn__hint">Ctrl+E</span>
    </button>
    <button class="btn" id="btnTools" title="工具抽屉：任务 / 术语 / 设置（Ctrl+Shift+T）">
      <svg class="icon icon--sm"><use href="#i-sliders"></use></svg>工具
    </button>
    <button class="icon-btn" id="btnStates" data-tip="状态演示：12 个状态真相" title="状态演示 Ctrl+Shift+D">
      <svg class="icon"><use href="#i-layers"></use></svg>
    </button>
    <button class="icon-btn" id="btnTheme" data-tip="切换主题 深/浅" title="切换主题">
      <svg class="icon"><use href="#i-moon"></use></svg>
    </button>
    <button class="icon-btn" id="btnKeys" data-tip="键位速查 F1" title="键位速查 F1">
      <svg class="icon"><use href="#i-keyboard"></use></svg>
    </button>
    <button class="icon-btn" id="btnCmd" data-tip="命令面板 Ctrl+K" title="命令面板 Ctrl+K">
      <svg class="icon"><use href="#i-command"></use></svg>
    </button>
    <button class="icon-btn" id="btnSettings" data-tip="设置 Ctrl+," title="设置 Ctrl+,">
      <svg class="icon"><use href="#i-cog"></use></svg>
    </button>
  </header>

  <!-- ===== 稿面工具条 32px ============================================= -->
  <div class="toolbar" role="toolbar" aria-label="稿面工具">
    <div class="toolbar__group" id="filterGroup">
      <span class="toolbar__label">筛选</span>
      <button class="chip" data-filter="all" aria-pressed="true">全部 <b id="cntAll">16</b></button>
      <button class="chip" data-filter="review" aria-pressed="false">待确认 <b id="cntReview">3</b></button>
      <button class="chip" data-filter="failed" aria-pressed="false">失败 <b id="cntFailed">2</b></button>
      <button class="chip" data-filter="locked" aria-pressed="false">已锁定 <b id="cntLocked">2</b></button>
      <button class="chip" data-filter="stale" aria-pressed="false">过期 <b id="cntStale">2</b></button>
    </div>

    <div class="toolbar__group">
      <label class="search" title="稿面内搜索（Ctrl+F）">
        <svg class="icon icon--sm"><use href="#i-search"></use></svg>
        <input id="searchInput" type="search" placeholder="搜索 Region / 原文 / 译文" autocomplete="off" spellcheck="false">
      </label>
    </div>

    <div class="toolbar__group">
      <span class="toolbar__label">字号</span>
      <div class="zoom" title="稿面字号缩放：- / +">
        <button id="zoomOut" aria-label="缩小字号"><svg class="icon icon--sm"><use href="#i-minus"></use></svg></button>
        <output id="zoomVal">100%</output>
        <button id="zoomIn" aria-label="放大字号"><svg class="icon icon--sm"><use href="#i-plus"></use></svg></button>
      </div>
    </div>

    <div class="toolbar__group">
      <span class="toolbar__label">显示</span>
      <button class="chip" id="optDiff" aria-pressed="true" title="显示机器译文与人工译文的差异下划线">差异</button>
      <button class="chip" id="optTerm" aria-pressed="true" title="显示术语冲突标记">术语</button>
    </div>

    <div class="toolbar__result" id="toolbarResult">16 条 · 已确认 9 · 待确认 3</div>
  </div>

  <!-- ===== 三栏主体 ==================================================== -->
  <main class="main">
    <nav class="tree" id="tree" aria-label="工程树"></nav>

    <section class="stage" id="stage" aria-label="工作稿">
      <div id="bannerSlot"></div>
      <div class="view" id="viewSlot"></div>
      <div class="flash is-hidden" id="flash"></div>
    </section>

    <aside class="margin" id="margin" aria-label="边注"></aside>
  </main>

  <!-- ===== 底栏 30px =================================================== -->
  <footer class="bottombar" id="bottombar" role="status"></footer>
</div>

<!-- ===== 遮罩层 ======================================================== -->
<div class="scrim is-hidden" id="scrim"></div>

<!-- 命令面板 -->
<div class="layer palette is-hidden" id="palette" role="dialog" aria-modal="true" aria-label="命令面板">
  <div class="palette__search">
    <svg class="icon icon--sm"><use href="#i-command"></use></svg>
    <input id="paletteInput" placeholder="输入命令、动作或页码…" autocomplete="off" spellcheck="false">
    <span class="palette__hint" id="paletteMode">命令</span>
  </div>
  <div class="palette__list" id="paletteList"></div>
  <div class="palette__foot">
    <span><b>↑ ↓</b> 选择</span>
    <span><b>Enter</b> 执行</span>
    <span><b>Esc</b> 关闭</span>
    <span id="paletteCount" style="margin-left:auto">0 项</span>
  </div>
</div>

<!-- 抽屉 -->
<div class="layer sheet is-hidden" id="sheet" role="dialog" aria-modal="true" aria-label="抽屉">
  <div class="sheet__head">
    <span class="sheet__title" id="sheetTitle">工具</span>
    <span class="sheet__meta" id="sheetMeta"></span>
    <button class="icon-btn" id="sheetClose" aria-label="关闭" data-tip="Esc">
      <svg class="icon"><use href="#i-close"></use></svg>
    </button>
  </div>
  <div class="sheet__tabs" id="sheetTabs" role="tablist"></div>
  <div class="sheet__body" id="sheetBody"></div>
  <div class="sheet__foot" id="sheetFoot"></div>
</div>

<!-- 状态演示面板 -->
<div class="layer states is-hidden" id="states" role="dialog" aria-modal="true" aria-label="状态演示面板">
  <div class="states__head">
    <span class="states__title">状态真相 · 12</span>
    <span class="states__meta" id="statesMeta"></span>
    <button class="icon-btn" id="statesClose" aria-label="关闭">
      <svg class="icon"><use href="#i-close"></use></svg>
    </button>
  </div>
  <div class="states__list" id="statesList"></div>
</div>

<!-- 对话框 -->
<div class="layer dialog is-hidden" id="dialog" role="alertdialog" aria-modal="true" aria-label="确认">
  <div class="dialog__head">
    <span class="dialog__title" id="dialogTitle">确认</span>
  </div>
  <div class="dialog__body" id="dialogBody"></div>
  <div class="dialog__foot" id="dialogFoot"></div>
</div>

<!-- 自定义悬停提示（200ms 延迟，规格要求 ≤400ms） -->
<div class="is-hidden" id="tip" role="tooltip"></div>

<script src="app.js"></script>
</body>
</html>
