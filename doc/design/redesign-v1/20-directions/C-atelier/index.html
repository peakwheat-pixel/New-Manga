<!-- ============================ 应用骨架 ============================ -->
<div class="app" id="app">

  <!-- 顶部阶段轨道 + 门禁条 -->
  <header class="rail" id="rail">
    <div class="rail-tabs" role="tablist" aria-label="流水线阶段">
      <div class="rail-brand">
        <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="wordmark">NEW MANGA<em>ATELIER · 工坊</em></span>
      </div>
      <div id="railTabs" style="display:contents"></div>
      <div class="rail-tools">
        <span class="rail-ctx">
          <span>批次</span><b id="ctxBatch">B-012</b>
          <span class="mono" id="ctxScope">第1–10章 · 240 页</span>
        </span>
        <button class="btn sm" data-action="palette" title="命令面板"><svg class="icon icon-12"><use href="#i-command"></use></svg>命令 <kbd>Ctrl</kbd><kbd>K</kbd></button>
        <button class="iconbtn" data-action="theme" title="切换主题 (T)"><svg class="icon" id="themeIcon"><use href="#i-sun"></use></svg></button>
        <button class="iconbtn" data-action="states" title="状态演示面板：12 个状态真相"><svg class="icon"><use href="#i-eye"></use></svg></button>
        <button class="iconbtn" data-action="settings" title="设置（Provider / 网络 / 并发）"><svg class="icon"><use href="#i-settings"></use></svg></button>
      </div>
    </div>
    <div class="gate" id="gateStrip" aria-label="阶段门禁"></div>
  </header>

  <div class="main" id="main">
    <!-- 左：资源树 -->
    <nav class="tree" id="tree" aria-label="资源树 作品 / 章节 / 批次 / 队列"></nav>

    <!-- 中：Page × Stage 状态矩阵（常驻、可直接操作） -->
    <section class="matrix" id="matrix" aria-label="Page × Stage 状态矩阵"></section>

    <!-- 右：概览条 + 阶段工作面 -->
    <div class="workwrap">
      <div class="chips" id="chips" role="toolbar" aria-label="概览计数与筛选"></div>
      <section class="surface" id="surface" aria-label="阶段工作面"></section>
    </div>

    <!-- 批量动作条：.bulk 的 CSS 以 .main 为定位上下文（left:var(--w-tree)），故它是 .main 的子元素 -->
    <div class="bulk" id="bulk" hidden aria-label="批量动作条"></div>
  </div>

  <!-- 底部：Run 状态带 -->
  <div class="runpanel" id="runPanel" hidden></div>
  <footer class="runstrip" id="runStrip" aria-label="当前 Run 状态"></footer>

  <!-- 详情抽屉 -->
  <aside class="drawer" id="drawer" data-open="0" aria-label="详情抽屉" aria-hidden="true"></aside>

  <!-- 状态演示面板 -->
  <aside class="states" id="states" data-open="0" aria-label="状态演示面板" aria-hidden="true"></aside>

  <!-- 命令面板 -->
  <div class="scrim hidden" id="scrim"></div>
  <div class="palette hidden" id="palette" role="dialog" aria-modal="true" aria-label="命令面板"></div>

  <!-- 对话框 -->
  <div class="dlg-scrim hidden" id="dlgScrim"></div>
  <div class="dlg hidden" id="dialog" role="dialog" aria-modal="true"></div>

  <!-- 演示说明条 -->
  <div class="demo-note hidden" id="demoNote"></div>
</div>

<noscript>
  <p style="padding:16px;color:#E6E9E8;background:#15181A">本原型需要 JavaScript 渲染假数据（纯本地，无网络请求）。</p>
</noscript>

<!-- 分层：数据（对齐 00_SAMPLE_DATA）→ 视图（纯渲染）→ 交互（状态/事件/键盘/URL） -->
<script src="data.js"></script>
<script src="views.js"></script>
<script src="app.js"></script>
</body>
</html>
