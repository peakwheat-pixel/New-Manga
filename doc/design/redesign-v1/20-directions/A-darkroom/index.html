<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Manga · 暗房 Darkroom · 方向 A 高保真原型</title>
<meta name="description" content="New Manga 全新 UI/UX 重设计 · 方向 A 暗房 · 纯静态零依赖高保真可交互原型">
<link rel="stylesheet" href="styles.css">
<script>
  /* 主题必须在首帧前决定，避免深浅闪烁。localStorage 记忆 + 查询参数覆盖。 */
  (function () {
    try {
      var q = new URLSearchParams(location.search);
      var t = q.get('theme') || localStorage.getItem('nm.theme') || 'dark';
      if (t !== 'light') t = 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
</head>
<body>

<div class="app" id="app">

  <!-- ════════════════════════════════════════════════════════════════════
       顶带 36px：三空间 · breadcrumb · 作用域 · 命令面板 · 主题
       ════════════════════════════════════════════════════════════════════ -->
  <header class="topband" role="banner">
    <nav class="spacetabs" aria-label="空间切换">
      <button class="spacetab" type="button" data-goto-space="library" title="资料柜 · Ctrl+1">
        <svg class="ico" aria-hidden="true"><use href="#i-library"></use></svg>
        <span class="spacetab-name">资料柜</span>
        <kbd class="kbd">1</kbd>
      </button>
      <button class="spacetab" type="button" data-goto-space="studio" title="工位 · Ctrl+2">
        <svg class="ico" aria-hidden="true"><use href="#i-studio"></use></svg>
        <span class="spacetab-name">工位</span>
        <kbd class="kbd">2</kbd>
      </button>
      <button class="spacetab" type="button" data-goto-space="console" title="控制台 · Ctrl+3">
        <svg class="ico" aria-hidden="true"><use href="#i-console"></use></svg>
        <span class="spacetab-name">控制台</span>
        <kbd class="kbd">3</kbd>
      </button>
    </nav>

    <div class="topband-mid">
      <nav class="crumb" id="crumb" aria-label="层级位置"></nav>
    </div>

    <div class="topband-right">
      <div class="scope" id="scope">
        <span class="scope-label">作用域</span>
        <button class="scope-btn" type="button" id="scopeBtn" aria-haspopup="true" aria-expanded="false">
          <span class="scope-text" id="scopeText">本章 23 页</span>
          <svg class="ico ico--sm" aria-hidden="true"><use href="#i-chevron-down"></use></svg>
        </button>
        <div class="menu" id="scopeMenu" hidden></div>
      </div>
      <button class="icobtn icobtn--labelled" type="button" id="btnCmd" title="命令面板 · Ctrl+K">
        <svg class="ico" aria-hidden="true"><use href="#i-command"></use></svg>
        <span class="icobtn-label">命令</span>
        <kbd class="kbd">K</kbd>
      </button>
      <button class="icobtn" type="button" id="btnStates" title="状态演示 · 12 个状态真相" aria-expanded="false">
        <svg class="ico" aria-hidden="true"><use href="#i-eye"></use></svg>
        <span class="icobtn-badge" id="stateBadge">12</span>
      </button>
      <button class="icobtn" type="button" id="btnTheme" title="切换深浅主题">
        <svg class="ico theme-dark" aria-hidden="true"><use href="#i-sun"></use></svg>
        <svg class="ico theme-light" aria-hidden="true"><use href="#i-moon"></use></svg>
      </button>
    </div>
  </header>

  <!-- ════════════════════════════════════════════════════════════════════
       空间 1 · Library 资料柜
       ════════════════════════════════════════════════════════════════════ -->
  <main class="space space--library" id="space-library" hidden>
    <div class="lib-bar">
      <span class="lib-title">资料柜</span>
      <span class="lib-sep"></span>
      <span class="lib-stat" id="libStat"></span>
      <div class="lib-bar-right">
        <label class="field field--search">
          <svg class="ico ico--sm" aria-hidden="true"><use href="#i-search"></use></svg>
          <input type="text" id="libSearch" placeholder="搜索作品 / 章节 / 页" autocomplete="off" spellcheck="false">
        </label>
        <button class="btn" type="button" id="btnImportDir">
          <svg class="ico ico--sm" aria-hidden="true"><use href="#i-import"></use></svg>导入文件夹
        </button>
        <button class="btn" type="button" id="btnImportFile">导入文件</button>
        <button class="btn btn--ghost" type="button" id="btnRecycle">
          <svg class="ico ico--sm" aria-hidden="true"><use href="#i-trash"></use></svg>回收站 <span class="num" id="recycleCount">2</span>
        </button>
      </div>
    </div>

    <div class="shelf" id="shelf"></div>

    <div class="lib-body">
      <section class="lib-chapters" aria-label="章节">
        <div class="pane-head">
          <span class="pane-title">章节</span>
          <span class="pane-meta" id="chapterMeta"></span>
          <span class="pane-spacer"></span>
          <button class="icobtn icobtn--sm" type="button" title="按状态排序">
            <svg class="ico ico--sm" aria-hidden="true"><use href="#i-filter"></use></svg>
          </button>
        </div>
        <div class="table-wrap"><table class="grid grid--chapters" id="chapterTable"></table></div>
        <div class="dropzone" id="dropzone">
          <svg class="ico" aria-hidden="true"><use href="#i-import"></use></svg>
          <span class="dropzone-title">拖入文件夹或图片序列</span>
          <span class="dropzone-hint">识别为「夜光列车 · 第 13 话」或新建作品 · 不清空现有数据</span>
        </div>
      </section>

      <section class="lib-pages" aria-label="页面">
        <div class="pane-head">
          <span class="pane-title" id="pagesTitle">第 12 话 · 雨の停車場</span>
          <span class="pane-meta" id="pagesMeta"></span>
          <span class="pane-spacer"></span>
          <button class="btn btn--ghost btn--sm" type="button" id="btnOpenReader">
            <svg class="ico ico--sm" aria-hidden="true"><use href="#i-page"></use></svg>阅读
          </button>
        </div>
        <div class="sheet" id="pageSheet"></div>
      </section>
    </div>

    <div class="import-dock" id="importDock" hidden></div>
    <div class="reader" id="reader" hidden></div>
  </main>

  <!-- ════════════════════════════════════════════════════════════════════
       空间 2 · Studio 工位（默认）
       ════════════════════════════════════════════════════════════════════ -->
  <main class="space space--studio" id="space-studio">
    <div class="banner-slot" id="bannerSlot" hidden></div>

    <aside class="filmstrip" id="filmStrip" aria-label="胶片条">
      <div class="filmstrip-head">
        <button class="icobtn icobtn--sm" type="button" id="btnFilm" title="展开 / 收起胶片条">
          <svg class="ico ico--sm" aria-hidden="true"><use href="#i-film"></use></svg>
        </button>
        <span class="filmstrip-meta" id="filmMeta"></span>
      </div>
      <ol class="filmstrip-list" id="filmList" tabindex="0" aria-label="页列表"></ol>
    </aside>

    <section class="viewport" id="viewport">
      <div class="vpchrome vpchrome--page" id="vpPageChip"></div>
      <div class="vpchrome vpchrome--view" id="vpViewSeg"></div>
      <div class="vpchrome vpchrome--zoom" id="vpZoom"></div>
      <div class="vpchrome vpchrome--tracks" id="vpTracks"></div>
      <div class="stage" id="stage"></div>
      <div class="reviewrail" id="reviewRail" hidden></div>
    </section>

    <aside class="inspector" id="inspector" aria-label="检查器">
      <nav class="insp-rail" id="inspRail" aria-label="检查器分区"></nav>
      <div class="insp-pane" id="inspPane"></div>
    </aside>

    <footer class="pipeline" id="pipeline" aria-label="流水线带"></footer>
  </main>

  <!-- ════════════════════════════════════════════════════════════════════
       空间 3 · Console 控制台
       ════════════════════════════════════════════════════════════════════ -->
  <main class="space space--console" id="space-console" hidden>
    <nav class="console-index" id="consoleIndex" aria-label="控制台索引"></nav>
    <section class="console-pane" id="consolePane"></section>
  </main>
</div>

<!-- ══════════════════════════════════════════════════════════════════════
     全局浮层
     ══════════════════════════════════════════════════════════════════════ -->

<!-- 命令面板 Ctrl+K -->
<div class="scrim" id="cmdScrim" hidden></div>
<div class="cmd" id="cmd" role="dialog" aria-modal="true" aria-label="命令面板" hidden>
  <div class="cmd-head">
    <svg class="ico" aria-hidden="true"><use href="#i-search"></use></svg>
    <input type="text" id="cmdInput" placeholder="输入命令或对象名 · 例如「重渲染」「第7页」「Provider」" autocomplete="off" spellcheck="false">
    <kbd class="kbd">Esc</kbd>
  </div>
  <div class="cmd-list" id="cmdList"></div>
  <div class="cmd-foot">
    <span><kbd class="kbd">↑</kbd><kbd class="kbd">↓</kbd> 选择</span>
    <span><kbd class="kbd">Enter</kbd> 执行</span>
    <span class="cmd-scope" id="cmdScope"></span>
  </div>
</div>

<!-- 状态演示抽屉 -->
<aside class="drawer" id="stateDrawer" hidden aria-label="状态演示">
  <div class="drawer-head">
    <span class="drawer-title">状态真相 · 12</span>
    <button class="icobtn icobtn--sm" type="button" id="btnStateClose"><svg class="ico ico--sm" aria-hidden="true"><use href="#i-close"></use></svg></button>
  </div>
  <p class="drawer-note">逐条点击即可把整个原型切到该状态。所有状态使用同一份假数据（夜光列车 · 第12话 · 23 页）。</p>
  <ol class="statelist" id="stateList"></ol>
  <div class="drawer-foot">
    <button class="btn btn--ghost btn--sm" type="button" id="btnStateReset">回到默认演示态</button>
  </div>
</aside>

<!-- 模态：中断恢复 / 危险确认 -->
<div class="scrim" id="modalScrim" hidden></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" hidden></div>

<script src="app.js"></script>
</body>
</html>
