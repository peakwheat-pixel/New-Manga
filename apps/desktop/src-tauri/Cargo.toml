[package]
name = "m2rc1-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "m2rc1-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 1
debug = false
incremental = true
codegen-units = 256
