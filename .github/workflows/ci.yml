# V11R-A-4: same-SHA CI. Every job must be reproducible from a plain `git clone` of the commit:
# no maintainer task-env, no absolute checkout paths, no hidden machine state.
#
# Jobs:
#   path-audit   - tools/ci/verify-clean-clone.ps1: no machine-absolute paths in operational files,
#                  CI inputs locatable, model weights reported (SKIPPED, not silently passed).
#   python-tests - pytest (fixture-dependent tests self-skip with an explicit reason on a clean clone).
#   dotnet-tests - dotnet build -warnaserror + full solution test (serialized; sidecar tests self-skip).
#   dotnet-integration - builds the weights-free sidecar from the same SHA and runs the full .NET
#                  suite against it, so integration evidence is reproducible from CI rather than a
#                  maintainer machine.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  path-audit:
    name: path-audit (clean clone)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify no machine-absolute paths / inputs locatable
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/ci/verify-clean-clone.ps1 `
            -ReportPath "${{ github.workspace }}/out/clean-clone.json"
          Get-Content "${{ github.workspace }}/out/clean-clone.json" -Raw | Select-Object -First 1

      - name: Upload clean-clone report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-clone-report
          path: out/clean-clone.json
          if-no-files-found: warn

  python-tests:
    name: python pytest
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        shell: pwsh
        run: python -m pytest -q -p no:cacheprovider

  dotnet-tests:
    name: dotnet build + test (no sidecar)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build (warnings are errors)
        shell: pwsh
        run: dotnet build apps/desktop-avalonia/NewManga.sln -warnaserror

      - name: Test (serialized; sidecar-dependent tests self-skip on a clean clone)
        shell: pwsh
        run: |
          dotnet test apps/desktop-avalonia/NewManga.sln --no-build -m:1 `
            --logger "trx;LogFileName=results.trx" `
            --results-directory "${{ github.workspace }}/out/test-results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: out/test-results/**
          if-no-files-found: warn

  dotnet-integration:
    name: dotnet integration (weights-free sidecar, same SHA)
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies (runtime + PyInstaller)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Build weights-free sidecar bundle
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          pwsh -NoProfile -File packaging/m2ac5/build_sidecar.ps1 -PythonExe $py -SkipWeights -SkipPythonRuntime

      - name: Build solution (warnings are errors)
        shell: pwsh
        run: dotnet build apps/desktop-avalonia/NewManga.sln -warnaserror

      - name: Test against the same-SHA sidecar
        shell: pwsh
        env:
          NEWMANGA_CORECLIENT_SIDECAR_DIR: ${{ github.workspace }}/apps/desktop-avalonia/build/sidecar/core-sidecar/core-sidecar
        run: |
          dotnet test apps/desktop-avalonia/NewManga.sln --no-build -m:1 `
            --logger "trx;LogFileName=results-integration.trx" `
            --results-directory "${{ github.workspace }}/out/test-results-integration"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-integration-results
          path: out/test-results-integration/**
          if-no-files-found: warn
