# New Manga — public build pipeline for release signing (draft)
#
# Purpose: build the release installer from public source on a clean Windows runner, then submit the
# unsigned installer to SignPath for Authenticode signing. This file is a DRAFT delivered by the
# SIGNPATH-OSS-SIGNING-1 task: it is intentionally NOT triggered automatically (no push/tag trigger yet)
# and the signing step stays disabled until the maintainer adds the repository secrets issued by
# SignPath Foundation. It must never publish a fake or partially signed artifact.
#
# Secrets used only by the signing step (never committed):
#   SIGNPATH_API_TOKEN, SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG
#
# Rollout plan (see doc/release/SIGNPATH-APPLICATION-CHECKLIST.md):
#   1. push this workflow together with LICENSE/README and the public source tree;
#   2. run it once with signing disabled to prove the public build works;
#   3. after SignPath approval: add secrets, enable the signing steps, cut a tag.

name: build-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string, e.g. 0.1.0"
        required: true
        default: "0.1.0"
  # Tags are enabled deliberately only after SignPath approval:
  # push:
  #   tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show toolchain
        shell: pwsh
        run: |
          dotnet --info
          python --version
          # NSIS is required by build-installer.ps1; the local pipeline uses a portable NSIS 3.13.
          # On a public runner install it from Chocolatey so builders do not need a private cache.
          choco install nsis --no-progress -y

      - name: Restore Python dependencies (Core sidecar build)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Python tests
        shell: pwsh
        run: python -m pytest -q

      - name: Run .NET tests
        shell: pwsh
        run: |
          # The Host integration tests need a frozen sidecar directory; the public pipeline runs the
          # projects that do not require a prebuilt sidecar, and the full suite runs on the maintainer
          # machine (258/258 on 2026-10-28). Host tests are added back once the sidecar build step is public.
          dotnet test apps/desktop-avalonia/tests/NewManga.CoreClient.Tests/NewManga.CoreClient.Tests.csproj -c Release
          dotnet test apps/desktop-avalonia/tests/NewManga.App.Tests/NewManga.App.Tests.csproj -c Release

      - name: Build Core sidecar bundle
        shell: pwsh
        run: |
          # Produces apps/desktop/src-tauri/target/core-sidecar/core-sidecar with core_service.exe etc.
          pwsh -NoProfile -File packaging/m2ac5/build_sidecar.ps1

      - name: Build base package (unsigned)
        shell: pwsh
        run: |
          pwsh -NoProfile -File apps/desktop-avalonia/scripts/package.ps1 `
            -OutputRoot "${{ github.workspace }}/out" `
            -Version "${{ github.event.inputs.version }}"

      - name: Build NSIS installer (unsigned)
        shell: pwsh
        run: |
          pwsh -NoProfile -File apps/desktop-avalonia/scripts/build-installer.ps1 `
            -StageDir "${{ github.workspace }}/out/NewManga-${{ github.event.inputs.version }}-win-x64" `
            -OutDir "${{ github.workspace }}/out" `
            -Version "${{ github.event.inputs.version }}"

      - name: Write SHA-256 manifest
        shell: pwsh
        run: |
          pwsh -NoProfile -File packaging/release/generate-checksums.ps1 `
            -BaseZip "${{ github.workspace }}/out/NewManga-${{ github.event.inputs.version }}-win-x64.zip" `
            -SetupExe "${{ github.workspace }}/out/NewManga-${{ github.event.inputs.version }}-setup.exe" `
            -OutFile "${{ github.workspace }}/out/SHA256SUMS"

      - name: Upload unsigned artifacts (build evidence)
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-release
          path: |
            out/NewManga-*-setup.exe
            out/SHA256SUMS
          if-no-files-found: error

      # ---------------------------------------------------------------------------------------------
      # SignPath signing (enable ONLY after SignPath Foundation approval + repository secrets).
      # The official action submits a signing request; SignPath builds and signs the installer on its
      # own infrastructure and returns the signed artifact. Keep the condition so a missing secret can
      # never silently produce an unsigned "release".
