# New Manga — public build pipeline for release signing (draft)
#
# Purpose: build the release installer from public source on a clean Windows runner, then submit the
# unsigned installer to SignPath for Authenticode signing. This file is a DRAFT delivered by the
# SIGNPATH-OSS-SIGNING-1 task: it is intentionally NOT triggered by tags yet (only workflow_dispatch) and
# the signing step only runs when the `sign` input is true AND the SignPath secrets exist. It must never
# publish a fake or partially signed artifact.
#
# Secrets used only by the signing step (never committed):
#   SIGNPATH_API_TOKEN, SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG
#
# Rollout plan (see doc/release/SIGNPATH-APPLICATION-CHECKLIST.md):
#   1. push this workflow together with LICENSE/README and the public source tree;
#   2. run it once with sign=false to prove the public build works;
#   3. after SignPath approval: add secrets, run with sign=true, cut a release tag.
#
# Scope: the public CI builds a WEIGHTS-FREE base package (sidecar -SkipWeights). The full local release
# pipeline (`packaging/release/*`) additionally builds the -models variant and the three-artifact manifest.
# The 258-test .NET suite (including Host integration tests that need a prebuilt sidecar) runs on the
# maintainer machine; this workflow runs pytest + the projects that do not need a prebuilt sidecar.

name: build-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string, e.g. 0.1.0"
        required: true
        default: "0.1.0"
      sign:
        description: "Submit the installer to SignPath (requires secrets; keep false until approved)"
        type: boolean
        required: false
        default: false
  # Tags are enabled deliberately only after SignPath approval:
  # push:
  #   tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show toolchain
        shell: pwsh
        run: |
          dotnet --info
          python --version
          choco install nsis --no-progress -y

      - name: "Restore Python dependencies (runtime + dev: pytest/PyInstaller)"
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Python tests
        shell: pwsh
        run: python -m pytest -q

      - name: Run .NET tests (projects that do not require a prebuilt sidecar)
        shell: pwsh
        run: |
          dotnet test apps/desktop-avalonia/tests/NewManga.CoreClient.Tests/NewManga.CoreClient.Tests.csproj -c Release
          dotnet test apps/desktop-avalonia/tests/NewManga.App.Tests/NewManga.App.Tests.csproj -c Release

      - name: Build Core sidecar bundle (weights-free public build)
        shell: pwsh
        run: |
          # build_sidecar.ps1 requires a real python.exe path (Test-Path/Resolve-Path inside the script),
          # so resolve the interpreter from PATH instead of passing the bare command name.
          $py = (Get-Command python).Source
          pwsh -NoProfile -File packaging/m2ac5/build_sidecar.ps1 -PythonExe $py -SkipWeights

      - name: Build base package (unsigned)
        shell: pwsh
        run: |
          pwsh -NoProfile -File apps/desktop-avalonia/scripts/package.ps1 `
            -OutputRoot "${{ github.workspace }}/out" `
            -Version "${{ github.event.inputs.version }}" `
            -SidecarDir "${{ github.workspace }}/apps/desktop-avalonia/build/sidecar/core-sidecar/core-sidecar"

      - name: Build NSIS installer (unsigned)
        shell: pwsh
        run: |
          pwsh -NoProfile -File apps/desktop-avalonia/scripts/build-installer.ps1 `
            -StageDir "${{ github.workspace }}/out/NewManga-${{ github.event.inputs.version }}-win-x64" `
            -OutDir "${{ github.workspace }}/out" `
            -Version "${{ github.event.inputs.version }}"

      - name: Write base-only SHA-256 manifest
        shell: pwsh
        run: |
          # The full three-artifact manifest (base + models + setup) is produced by the maintainer release
          # pipeline via packaging/release/generate-checksums.ps1; the public CI only builds the base
          # variant, so it writes a base-only manifest for its own artifacts.
          $out = "${{ github.workspace }}/out"
          $entries = @(
            "NewManga-${{ github.event.inputs.version }}-win-x64.zip",
            "NewManga-${{ github.event.inputs.version }}-setup.exe"
          ) | ForEach-Object {
            $p = Join-Path $out $_
            if (-not (Test-Path -LiteralPath $p)) { throw "missing artifact: $p" }
            ((Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLower()) + "  " + $_
          }
          Set-Content -LiteralPath (Join-Path $out "SHA256SUMS") -Value ($entries -join "`n") -Encoding utf8
          Get-Content (Join-Path $out "SHA256SUMS")

      - name: Upload unsigned artifacts (build evidence)
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-release
          path: |
            out/NewManga-*-setup.exe
            out/NewManga-*-win-x64.zip
            out/SHA256SUMS
          if-no-files-found: error

      # ---------------------------------------------------------------------------------------------
      # SignPath signing. Enable ONLY after SignPath Foundation approval + repository secrets.
      # GitHub Actions `secrets` cannot be used in `if:`; the switch is the `sign` workflow input,
      # and the token is injected only into this step's env. SignPath signs the installer on its own
      # infrastructure and returns the signed artifact. Never fabricate a signature when secrets are
      # missing: the step fails fast instead.
