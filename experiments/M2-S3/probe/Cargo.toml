[package]
name = "m2s3-probe"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "m2s3-probe"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
base64 = "0.22"

[profile.release]
opt-level = 1
debug = false
incremental = true
codegen-units = 256
